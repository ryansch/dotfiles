# Plannotator owns plannotator-inbox.service itself: inbox-scheduled-login.ts
# writes that unit from inboxLoginUnit() whenever the start-at-login item is
# turned on, overwriting whatever is there. Anything added to the unit file is
# lost the next time that happens.
#
# Its remove() deletes only the unit file and never this directory, so everything
# this setup needs belongs here rather than in the unit.

[Service]
# The generated ExecStart is `inbox --no-open`, which self-detaches and rebuilds
# the child's PATH from the system default -- the shim below is then NOT on it,
# and PLANNOTATOR_INBOX_TAILSCALE is dropped, so nothing publishes. `--background`
# instead spawns the child with this unit's environment intact, which is what
# actually reaches the tailnet. Clearing ExecStart first is required to replace it.
Type=oneshot
RemainAfterExit=yes
ExecStart=
ExecStart=%h/.local/bin/plannotator inbox --background --tailscale
ExecStop=%h/.local/bin/plannotator inbox stop

# Plannotator shells out to a bare `tailscale` and cannot be told a socket
# (packages/shared/tailscale.ts, createTailscaleRunner). Under tailmix there is
# no default tailscaled socket, so the shim directory has to come first for the
# personal ("home") profile to be reachable. It is deliberately NOT on the login
# shell's PATH: `tailscale` typed in a terminal still means the work profile.
Environment=PATH=%h/.local/libexec/plannotator:%h/.local/bin:/usr/local/bin:/usr/bin:/bin

# The Inbox answers 403 on a Host header it does not recognise, which is also
# what stops DNS rebinding reaching it. %l is systemd's short hostname, so this
# names the right machine anywhere and keeps no network detail in the file.
# A literal LAN IP is deliberately absent: .lan resolves over the tailnet from
# away, so the names cover both home and remote.
Environment=PLANNOTATOR_ALLOWED_HOSTS=%l.lan,%l,%l.local,localhost,127.0.0.1

# Optional, untracked, per-machine overrides: extra hostnames, a literal IP, or
# PLANNOTATOR_TAILMIX_PROFILE when the personal tailnet is not in "home". Listed
# after the defaults so it wins; `-` means the drop-in still loads without it.
EnvironmentFile=-%h/.config/plannotator/local.env

Environment=PLANNOTATOR_BROWSER=none
