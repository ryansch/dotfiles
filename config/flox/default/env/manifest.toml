schema-version = "1.19.0"
minimum-cli-version = "1.19.0"

[include]
environments = [{ remote = "ryansch/ruby-4.0" }]

## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
neovim.pkg-path = "neovim"

gcc.pkg-path = "gcc"
gcc.systems = ["x86_64-linux", "aarch64-linux"]

# macOS gets tea and op from Homebrew
tea.pkg-path = "tea"
tea.systems = ["x86_64-linux", "aarch64-linux"]

op.pkg-path = "_1password-cli"
op.systems = ["x86_64-linux", "aarch64-linux"]

# macOS gets docker-credential-ecr-login from Homebrew
amazon-ecr-credential-helper.pkg-path = "amazon-ecr-credential-helper"
amazon-ecr-credential-helper.systems = ["x86_64-linux", "aarch64-linux"]

desk.pkg-path = "ryansch/desk"

## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = """
  export NPM_CONFIG_PREFIX="$FLOX_ENV_CACHE/npm"
  export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
  export NODE_PATH="$NPM_CONFIG_PREFIX/lib/node_modules:$NODE_PATH"
"""


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
# common = """
#   typeset -U path PATH
#   path+=("$GEM_HOME/bin")
# """
## Shell specific profiles go here:
# bash = ...
# zsh  = ...
# fish = ...


## Services ----------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## -------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Other Environment Options -----------------------------------------
[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
# Uncomment to disable CUDA detection.
# cuda-detection = false
activate.mode = "run"
